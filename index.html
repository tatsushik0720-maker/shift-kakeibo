<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#0e1413" media="(prefers-color-scheme: dark)">

<style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>シフト家計簿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="シフト家計簿">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* レイアウト：上に月の切り替え、下にタブバー。中身は1列のカード。家計の紙の帳面のように罫線で区切る */
:root {
  --bg: #eef2f0;
  --surface: #ffffff;
  --surface-2: #f6f8f7;
  --ink: #17211f;
  --muted: #5b6a67;
  --line: #dbe3e0;
  --income: #2160c4;
  --expense: #cf3b3b;
  --warn: #b86e00;
  --ok: #1f8a4c;
  --accent-l: #0b7f6c; --accent-d: #3cc4ac;
  --accent: var(--accent-l);
  --on-accent: #ffffff;
  --scrim: rgba(10, 20, 18, .42);
  --shadow: 0 1px 2px rgba(20, 40, 36, .06), 0 6px 20px rgba(20, 40, 36, .08);
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-head: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "IBM Plex Sans JP", sans-serif;
  --r: 14px;
}
:root[data-accent="ai"] { --accent-l: #3451c9; --accent-d: #8ea4ff; }
:root[data-accent="kaki"] { --accent-l: #c2511c; --accent-d: #ff9a62; }
:root[data-accent="sakura"] { --accent-l: #c23a6e; --accent-d: #ff8db7; }
:root[data-accent="sumi"] { --accent-l: #36423f; --accent-d: #c8d4d1; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1413; --surface: #161f1d; --surface-2: #1c2725; --ink: #e6eeec; --muted: #94a5a1; --line: #273432;
    --income: #6ea4ff; --expense: #ff7f7f; --warn: #f0b44a; --ok: #5fd08f;
    --accent: var(--accent-d); --on-accent: #0b1210; --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1413; --surface: #161f1d; --surface-2: #1c2725; --ink: #e6eeec; --muted: #94a5a1; --line: #273432;
  --income: #6ea4ff; --expense: #ff7f7f; --warn: #f0b44a; --ok: #5fd08f;
  --accent: var(--accent-d); --on-accent: #0b1210; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); height: 100%; overflow: hidden; overscroll-behavior: none; }
/* 画面全体は動かさず、真ん中だけをスクロールさせる（上の月と下のタブを固定するため） */
body { display: flex; flex-direction: column; }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.inc { color: var(--income); }
.exp { color: var(--expense); }
.muted { color: var(--muted); }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 上のバー */
.top { flex: none; position: relative; z-index: 5; background: var(--bg); border-bottom: 1px solid transparent; }
.top.scrolled { border-bottom-color: var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; padding-block: 10px 8px; gap: 8px; }
.mbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.mbtn:active { background: var(--surface); }
.mlabel { font-family: var(--font-head); font-weight: 700; font-size: 19px; letter-spacing: .02em; padding: 4px 12px; border-radius: 10px; }
.mlabel small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 2px; }

main { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; padding-bottom: 20px; }
main .wrap { will-change: transform; display: flex; flex-direction: column; gap: 14px; padding-block: 2px 12px; }

.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; min-width: 0; }
.card h2 { font-family: var(--font-head); font-size: 15px; font-weight: 700; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-wrap: balance; }
.card h2 .sub { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 400; }
.notice { background: var(--surface-2); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--muted); }

/* 月の合計 */
.sums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
.sums > div { padding: 2px 8px; min-width: 0; }
.sums > div + div { border-left: 1px solid var(--line); }
.sums .lbl { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.sums .val { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.salary-line { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; gap: 8px; flex-wrap: wrap; }

/* カレンダー */
.cal { padding: 8px 6px 10px; }
.dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.dow div { text-align: center; font-size: 11px; color: var(--muted); padding: 2px 0 6px; }
.dow div:first-child, .day.sun .dn { color: var(--expense); }
.dow div:last-child, .day.sat .dn { color: var(--income); }
.day { min-height: 74px; border-top: 1px solid var(--line); padding: 3px 2px 2px; display: flex; flex-direction: column; gap: 1px; align-items: stretch; text-align: left; min-width: 0; position: relative; }
.day.out { opacity: .32; }
.day .dn { font-size: 12px; font-weight: 500; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; margin: 0 auto 1px; }
.day.today .dn { background: var(--ink); color: var(--bg) !important; }
.day.sel { background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 8px; }
.chip { display: block; font-size: 9.5px; line-height: 1.35; border-radius: 4px; padding: 0 3px; white-space: nowrap; overflow: hidden; text-overflow: clip; color: #fff; font-weight: 500; }
.amt { font-size: 9.5px; line-height: 1.3; text-align: right; white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; padding-right: 1px; }
.payflag { position: absolute; top: 3px; right: 2px; font-size: 9px; font-weight: 700; color: var(--on-accent); background: var(--accent); border-radius: 4px; padding: 0 3px; line-height: 1.4; }

/* 一覧 */
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-top: 1px solid var(--line); text-align: left; width: 100%; min-width: 0; }
.row:first-child { border-top: 0; }
.row .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.row .bar-ico { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .v { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row.tap:active { background: var(--surface-2); }
.empty { padding: 14px 4px; color: var(--muted); font-size: 13px; text-align: center; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1; min-height: 44px; border-radius: 12px; padding: 8px 12px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.inc { color: var(--income); }
.btn.exp { color: var(--expense); }
.btn.danger { color: var(--expense); }
.btn.small { flex: none; min-height: 34px; padding: 4px 12px; font-size: 13px; font-weight: 500; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .45; }

/* 給料 */
.big { font-size: 30px; font-weight: 700; letter-spacing: .01em; line-height: 1.2; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.meter { height: 10px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.meter > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 6px; }
.meter > i.warn { background: var(--warn); }
.meter > i.over { background: var(--expense); }
.meter-note { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 1px 9px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.pill.over { color: var(--expense); border-color: color-mix(in srgb, var(--expense) 40%, transparent); }
.jobhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.jobhead .dot { width: 12px; height: 12px; border-radius: 4px; }
.jobhead b { font-family: var(--font-head); font-size: 15px; }
.jobblock + .jobblock { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }

/* グラフ */
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 2px; gap: 2px; }
.seg button { padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.donut-wrap { display: flex; align-items: center; justify-content: center; padding: 6px 0 10px; }
.donut { width: min(220px, 70vw); height: auto; display: block; }
.donut text { fill: var(--ink); }
.bars { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; align-items: end; height: 150px; position: relative; padding-top: 6px; }
.bars .col { display: flex; gap: 1px; align-items: end; height: 100%; justify-content: center; position: relative; }
.bars .col i { display: block; width: 45%; border-radius: 3px 3px 0 0; min-height: 0; }
.bars .col.cur { background: color-mix(in srgb, var(--accent) 9%, transparent); border-radius: 6px 6px 0 0; }
.bars-x { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; font-size: 10px; color: var(--muted); text-align: center; margin-top: 4px; border-top: 1px solid var(--line); padding-top: 3px; }
.goal-line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--warn); pointer-events: none; }
.goal-line span { position: absolute; right: 0; top: -16px; font-size: 10px; color: var(--warn); background: var(--surface); padding: 0 3px; }
.ymax { font-size: 10px; color: var(--muted); }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.budgetbar { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-top: 5px; }
.budgetbar i { display: block; height: 100%; border-radius: 4px; }
.amt.plan { opacity: .5; }
.mlist { display: flex; flex-direction: column; gap: 6px; }
.dhead { display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left; padding: 8px 6px 6px; border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; }
.dhead.on { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.dhead .dd { font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.dhead .dhol { font-size: 11px; color: var(--expense); }
.dhead .dsum { margin-left: auto; display: flex; gap: 10px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dgroup .row { padding-left: 6px; padding-right: 6px; }
.dhead + .row { border-top: 0; }
.hbars { display: flex; flex-direction: column; gap: 14px; }
.hb-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13.5px; }
.hb-name { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 500; }
.hb-name i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.hb-val { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.hb-track { position: relative; height: 16px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); margin-top: 5px; }
.hb-track > i { position: absolute; inset: -1px auto -1px -1px; border-radius: 8px; }
.hb-budget { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 1px; transform: translateX(-1px); }
.hb-note { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.hb-note .up { color: var(--expense); }
.hb-note .down { color: var(--ok); }
.row.ended { opacity: .5; }

/* 設定 */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 8px 10px; }
.field textarea { min-height: 70px; resize: vertical; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fields .full { grid-column: 1 / -1; }
.hint { font-size: 12px; color: var(--muted); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; outline: 1px solid var(--line); }
.swatch[aria-pressed="true"] { border-color: var(--surface); outline: 2px solid var(--ink); }
.switch { width: 50px; height: 30px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }

/* 下のタブ */
.tabs { flex: none; position: relative; z-index: 6; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; height: 62px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--muted); padding: 6px 0; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 700; }
.fab { justify-self: center; width: 56px; height: 56px; border-radius: 18px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: var(--shadow); margin-top: -22px; }
.fab svg { width: 28px; height: 28px; }

/* 下から出るシート */
#sheetWrap { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
#sheetWrap .scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
.grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 2px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-head h3 { font-family: var(--font-head); font-size: 17px; margin: 0; }
.x { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.typeseg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; border: 1px solid var(--line); }
.typeseg button { min-height: 38px; border-radius: 9px; font-weight: 700; color: var(--muted); }
.typeseg button[aria-pressed="true"].e { background: var(--expense); color: #fff; }
.typeseg button[aria-pressed="true"].i { background: var(--income); color: #fff; }
.amount { display: flex; flex-direction: column; align-items: flex-end; padding: 6px 4px 2px; border-bottom: 2px solid var(--line); }
.amount .expr { font-size: 13px; color: var(--muted); min-height: 20px; font-variant-numeric: tabular-nums; }
.amount .tot { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.cur-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.rate-in { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.rate-in input { width: 96px; min-height: 36px; border: 1px solid var(--line); border-radius: 9px; padding: 4px 8px; background: var(--surface-2); text-align: right; }
.amount .conv { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hint a { color: var(--accent); }
.keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.keypad button { min-height: 46px; border-radius: 11px; background: var(--surface-2); font-size: 19px; font-weight: 500; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.keypad button.op { color: var(--accent); font-weight: 700; }
.keypad button:active { background: var(--line); }
.cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cat { min-height: 52px; border-radius: 11px; border: 1.5px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; padding: 4px 2px; min-width: 0; }
.cat i { width: 12px; height: 12px; border-radius: 50%; }
.cat span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-2); font-weight: 700; }
.tpls { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.tpl { flex: none; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 12.5px; background: var(--surface-2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tpl i { width: 8px; height: 8px; border-radius: 50%; }
.jobs-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.jobs-pick button { border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 12px; display: flex; align-items: center; gap: 6px; font-weight: 500; }
.jobs-pick button i { width: 10px; height: 10px; border-radius: 3px; }
.jobs-pick button[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-2); font-weight: 700; }
.mini { border: 1px solid var(--line); border-radius: 12px; padding: 8px; }

<script>
(() => {
'use strict';

// ---------- 小道具 ----------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = n => '¥' + Math.round(n || 0).toLocaleString('ja-JP');
const num = n => Math.round(n || 0).toLocaleString('ja-JP');
const short = n => { n = Math.round(n); const a = Math.abs(n); return a >= 100000 ? (n / 10000).toFixed(a >= 1000000 ? 0 : 1) + '万' : n.toLocaleString('ja-JP'); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ds = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return { y, m, d }; };
const dim = (y, m) => new Date(y, m, 0).getDate();
const dow = s => { const { y, m, d } = parseD(s); return new Date(y, m - 1, d).getDay(); };
const todayStr = () => { const t = new Date(); return ds(t.getFullYear(), t.getMonth() + 1, t.getDate()); };
const mkey = (y, m) => `m-${y}-${pad(m)}`;
const addM = (y, m, k) => { const t = (y * 12 + (m - 1)) + k; return { y: Math.floor(t / 12), m: (t % 12) + 1 }; };
const toMin = t => { const [h, mi] = String(t || '0:0').split(':').map(Number); return h * 60 + mi; };
const hm = min => `${Math.floor(min / 60)}時間${min % 60 ? pad(min % 60) + '分' : ''}`;
const hours = min => (min / 60).toFixed(min % 60 ? 1 : 0) + 'h';
const clone = o => JSON.parse(JSON.stringify(o));
const DOW = ['日', '月', '火', '水', '木', '金', '土'];

const JOB_COLORS = ['#0b7f6c', '#3451c9', '#c2511c', '#c23a6e', '#7a52c7', '#b08a00', '#2f8fb8', '#5e7a2a'];
const CAT_COLORS = ['#e0703a', '#3a8fd0', '#5f8a2b', '#d9487a', '#8a5cd6', '#c69a1f', '#3f7f78', '#22a39b', '#5866d8', '#d24a4a', '#8a8f8e', '#b5651d'];

function defaults() {
  return {
    v: 1,
    jobs: [],
    cats: {
      expense: [
        ['e_food', '食費', '#e0703a'], ['e_daily', '日用品', '#3a8fd0'], ['e_trans', '交通費', '#5f8a2b'], ['e_social', '交際費', '#d9487a'],
        ['e_hobby', '趣味', '#8a5cd6'], ['e_cloth', '衣服・美容', '#c69a1f'], ['e_home', '住まい', '#3f7f78'], ['e_util', '水道光熱', '#22a39b'],
        ['e_phone', '通信', '#5866d8'], ['e_med', '医療', '#d24a4a'], ['e_study', '勉強', '#b5651d'], ['e_other', 'その他', '#8a8f8e']
      ].map(([id, name, color]) => ({ id, name, color })),
      income: [
        ['i_salary', '給料', '#2160c4'], ['i_allow', 'お小遣い', '#22a39b'], ['i_extra', '臨時収入', '#c69a1f'], ['i_other', 'その他', '#8a8f8e']
      ].map(([id, name, color]) => ({ id, name, color }))
    },
    budgets: {},
    fixed: [],
    goalMonthly: 0,
    wall: 1230000,
    accent: 'wakatake',
    pass: null
  };
}
function newJob() {
  const used = S.settings.jobs.map(j => j.color);
  return { id: uid(), name: '', color: JOB_COLORS.find(c => !used.includes(c)) || JOB_COLORS[0], wage: 1100, transport: 0, nightRate: 25, otRate: 25, weekendAdd: 0, closing: 0, payOffset: 1, payDay: 25 };
}

// ---------- 状態 ----------
const now = new Date();
const S = {
  view: 'cal', y: now.getFullYear(), m: now.getMonth() + 1, sel: todayStr(),
  graphMode: 'month', graphType: 'expense', catTab: 'expense',
  settings: defaults(), months: {}, ready: false, mode: 'loading', col: null, unlocked: false
};
try { const v = sessionStorage.getItem('kk-unlocked'); if (v === '1') S.unlocked = true; } catch (e) {}
try { const v = localStorage.getItem('kk-view'); if (v && ['cal', 'pay', 'graph', 'set'].includes(v)) S.view = v; } catch (e) {}

const month = (y, m) => S.months[mkey(y, m)] || { tx: [], shifts: [] };
const ensureMonth = key => (S.months[key] ||= { tx: [], shifts: [] });
const keyOfDate = d => { const p = parseD(d); return mkey(p.y, p.m); };
const allShifts = () => Object.values(S.months).flatMap(m => m.shifts || []);
const jobById = id => S.settings.jobs.find(j => j.id === id);
const catsOf = type => S.settings.cats[type] || [];
const catById = (type, id) => catsOf(type).find(c => c.id === id) || { id, name: '未分類', color: '#8a8f8e' };

// ---------- 保存（claude.ai のデータベース、使えないときはこの端末） ----------
const pending = {}, writing = {};
function persist(docId) {
  pending[docId] = true;
  if (!writing[docId]) flush(docId);
}
async function flush(docId) {
  writing[docId] = true;
  while (pending[docId]) {
    pending[docId] = false;
    const body = docId === 'settings' ? S.settings : (S.months[docId] || { tx: [], shifts: [] });
    try {
      if (S.mode === 'db') {
        const empty = docId !== 'settings' && !body.tx.length && !body.shifts.length;
        if (empty) await S.col.doc(docId).delete(); else await S.col.doc(docId).set(clone(body));
      } else {
        saveLocal();
      }
    } catch (e) {
      console.error(e);
      if (e && e.code === 'quota_exceeded') toast('保存できる量の上限に達しました');
      else if (e && e.code === 'unavailable') { pending[docId] = true; await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); }
      else toast('保存に失敗しました。通信を確かめてください');
    }
  }
  writing[docId] = false;
}
function saveLocal() {
  try { localStorage.setItem('kk-data', JSON.stringify({ settings: S.settings, months: S.months })); } catch (e) {}
}
function loadLocal() {
  try {
    const raw = localStorage.getItem('kk-data');
    if (raw) { const d = JSON.parse(raw); S.settings = Object.assign(defaults(), d.settings || {}); S.months = d.months || {}; }
  } catch (e) {}
}

async function boot() {
  applyAccent();
  let db = null, user = null;
  if (window.claude && typeof window.claude.use === 'function') {
    try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { db = null; }
  }
  let id = null;
  if (db && user) { try { id = await user.id(); } catch (e) { id = null; } }
  if (db && id) {
    S.mode = 'db';
    S.col = db.collection('data/users/' + id);
    S.col.onSnapshot(snap => {
      const months = {}; let settings = null;
      snap.docs.forEach(d => {
        if (!d.exists) return;
        const body = clone(d.data());
        if (d.id === 'settings') settings = body;
        else if (d.id.startsWith('m-')) months[d.id] = { tx: body.tx || [], shifts: body.shifts || [] };
      });
      // まだ送っていない手元の変更は残す
      Object.keys(pending).forEach(k => { if (pending[k] || writing[k]) { if (k === 'settings') settings = S.settings; else months[k] = S.months[k]; } });
      S.months = months;
      S.settings = Object.assign(defaults(), settings || {});
      const first = !S.ready;
      S.ready = true;
      if (first && !settings) persist('settings');
      afterData(first);
    }, err => {
      console.error(err);
      toast('データの読み込みが止まりました。ページを開き直してください');
    });
  } else {
    S.mode = 'local';
    // ブラウザの都合でデータが消されにくくする
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    loadLocal();
    S.ready = true;
    afterData(true);
  }
}
function afterData(first) {
  applyAccent();
  applyFixed();
  if (first && S.settings.pass && !S.unlocked) showLock();
  render();
  if (first) setTimeout(maybeAskPay, 500);
}

// ---------- 毎月の固定費 ----------
// その月になったら実際の記録として書き込む（id が決まっているので2台で開いても重ならない）
const curYM = () => { const t = new Date(); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}`; };
const nextYM = ym => { const [y, m] = ym.split('-').map(Number); const p = addM(y, m, 1); return `${p.y}-${pad(p.m)}`; };
// 土日祝に当たったら、前か次の平日へずらす（月をまたぐこともある）
function fixedDate(f, y, m) {
  let d = ds(y, m, f.day ? Math.min(f.day, dim(y, m)) : dim(y, m));
  if (f.shift === 'before' || f.shift === 'after') {
    const step = f.shift === 'before' ? -1 : 1;
    for (let n = 0; n < 10 && isOff(d); n++) d = addDays(d, step);
  }
  return d;
}
const fixedActive = (f, ym) => f.start <= ym && (!f.end || ym <= f.end);
// ドルの固定費は、記録するときの為替レートで円に直す
function fixedTx(f, id, date) {
  const t = { id, date, type: f.type, amount: f.amount, cat: f.cat, memo: f.name, fixedId: f.id };
  if (f.currency === 'USD') { const rate = Number(S.settings.usdRate) || 0; Object.assign(t, { currency: 'USD', usd: f.amount, rate, amount: Math.round(f.amount * rate) }); }
  return t;
}
function applyFixed() {
  const cur = curYM(); const keys = new Set(); let changed = false;
  for (const f of S.settings.fixed || []) {
    if (!f.start) continue;
    let ym = f.done ? nextYM(f.done) : f.start;
    while (ym <= cur && (!f.end || ym <= f.end)) {
      const [y, m] = ym.split('-').map(Number);
      const id = `fx-${f.id}-${ym}`;
      if (!findTx(id)) {
        const date = fixedDate(f, y, m); const key = keyOfDate(date);
        ensureMonth(key).tx.push(fixedTx(f, id, date));
        keys.add(key);
      }
      f.done = ym; changed = true;
      ym = nextYM(ym);
    }
  }
  keys.forEach(persist);
  if (changed) persist('settings');
}
// 来月以降の予定（まだ記録していない分）。ずらして月をまたぐ分も拾う
function plannedFixed(y, m) {
  const cur = curYM(); const out = [];
  for (const f of S.settings.fixed || []) {
    for (const k of [-1, 0, 1]) {
      const p = addM(y, m, k); const ym = `${p.y}-${pad(p.m)}`;
      if (ym <= cur || !fixedActive(f, ym)) continue;
      const date = fixedDate(f, p.y, p.m); const q = parseD(date);
      if (q.y === y && q.m === m) out.push({ ...fixedTx(f, `plan-${f.id}-${ym}`, date), planned: true });
    }
  }
  return out;
}

// ---------- 祝日（祝日法の決まりから計算する） ----------
const addDays = (s, n) => { const p = parseD(s); const t = new Date(p.y, p.m - 1, p.d + n); return ds(t.getFullYear(), t.getMonth() + 1, t.getDate()); };
const holCache = {};
function holidays(y) {
  if (holCache[y]) return holCache[y];
  const h = new Map();
  const add = (m, d, n) => h.set(ds(y, m, d), n);
  const nthMon = (m, n) => 1 + (8 - new Date(y, m - 1, 1).getDay()) % 7 + (n - 1) * 7;
  const k = y - 1980;
  add(1, 1, '元日'); add(1, nthMon(1, 2), '成人の日'); add(2, 11, '建国記念の日'); add(2, 23, '天皇誕生日');
  add(3, Math.floor(20.8431 + 0.242194 * k - Math.floor(k / 4)), '春分の日');
  add(4, 29, '昭和の日'); add(5, 3, '憲法記念日'); add(5, 4, 'みどりの日'); add(5, 5, 'こどもの日');
  add(7, nthMon(7, 3), '海の日'); add(8, 11, '山の日'); add(9, nthMon(9, 3), '敬老の日');
  add(9, Math.floor(23.2488 + 0.242194 * k - Math.floor(k / 4)), '秋分の日');
  add(10, nthMon(10, 2), 'スポーツの日'); add(11, 3, '文化の日'); add(11, 23, '勤労感謝の日');
  // 祝日にはさまれた平日は休み（国民の休日）
  for (const d of [...h.keys()].sort()) {
    const d1 = addDays(d, 1), d2 = addDays(d, 2);
    if (h.has(d2) && !h.has(d1) && dow(d1) !== 0) h.set(d1, '国民の休日');
  }
  // 日曜の祝日は、次の祝日でない日が振替休日
  for (const d of [...h.keys()].sort()) {
    if (dow(d) !== 0) continue;
    let x = addDays(d, 1); while (h.has(x)) x = addDays(x, 1);
    h.set(x, '振替休日');
  }
  return holCache[y] = h;
}
const holidayName = d => holidays(+d.slice(0, 4)).get(d) || '';
const isOff = d => { const w = dow(d); return w === 0 || w === 6 || !!holidayName(d); };
const fmtUsd = v => '$' + (Math.round(v * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usdNote = t => t.currency === 'USD' ? `${fmtUsd(t.usd)}（1ドル${t.rate}円）` : '';

// ---------- 給料の計算 ----------
const NIGHT_S = 22 * 60, NIGHT_E = 5 * 60;
function calcShift(sh, job) {
  if (!job) return { work: 0, night: 0, ot: 0, pay: 0, base: 0, nightPay: 0, otPay: 0, trans: 0, wkAdd: 0 };
  const s = toMin(sh.start); let e = toMin(sh.end); if (e <= s) e += 1440;
  const total = e - s;
  let night = 0;
  for (let t = s; t < e; t++) { const x = t % 1440; if (x >= NIGHT_S || x < NIGHT_E) night++; }
  const brk = Math.min(Number(sh.brk) || 0, total);
  const work = total - brk;
  const dayMin = total - night;
  const nightWork = Math.max(0, night - Math.max(0, brk - dayMin));
  const ot = Math.max(0, work - 480);
  const wkd = dow(sh.date); const isWk = wkd === 0 || wkd === 6;
  const w = (Number(job.wage) || 0) + (isWk ? (Number(job.weekendAdd) || 0) : 0);
  const base = w * work / 60;
  const nightPay = w * (Number(job.nightRate) || 0) / 100 * nightWork / 60;
  const otPay = w * (Number(job.otRate) || 0) / 100 * ot / 60;
  const trans = Number(job.transport) || 0;
  const pay = Math.round(base + nightPay + otPay + trans);
  return { work, night: nightWork, ot, pay, base, nightPay, otPay, trans, wkAdd: isWk ? (Number(job.weekendAdd) || 0) * work / 60 : 0 };
}
// 勤務期間（締め日で区切る）。「m月分」= m月に締める期間
function periodOf(job, y, m) {
  const c = Number(job.closing) || 0;
  let start, end;
  if (!c) { start = ds(y, m, 1); end = ds(y, m, dim(y, m)); }
  else {
    const p = addM(y, m, -1);
    const sd = Math.min(c, dim(p.y, p.m)) + 1;
    start = sd > dim(p.y, p.m) ? ds(y, m, 1) : ds(p.y, p.m, sd);
    end = ds(y, m, Math.min(c, dim(y, m)));
  }
  const q = addM(y, m, Number(job.payOffset) || 0);
  const pd = Number(job.payDay) || 0;
  const payDate = ds(q.y, q.m, pd ? Math.min(pd, dim(q.y, q.m)) : dim(q.y, q.m));
  return { start, end, payDate, y, m };
}
function periodSum(job, y, m) {
  const p = periodOf(job, y, m);
  const shifts = allShifts().filter(s => s.jobId === job.id && s.date >= p.start && s.date <= p.end).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
  const t = { work: 0, night: 0, ot: 0, pay: 0, base: 0, nightPay: 0, otPay: 0, trans: 0, wkAdd: 0, count: shifts.length };
  shifts.forEach(s => { const r = calcShift(s, job); for (const k in r) t[k] += r[k]; });
  return { ...p, shifts, ...t };
}
function monthSalary(y, m) { return S.settings.jobs.reduce((a, j) => a + periodSum(j, y, m).pay, 0); }
// その年に支給される分（扶養・年収の壁は支給日で数える）
function yearPaid(y) {
  let total = 0, toDate = 0; const td = todayStr();
  S.settings.jobs.forEach(j => {
    for (let k = -3; k <= 12; k++) {
      const { y: yy, m: mm } = addM(y, 1, k - 1);
      const p = periodOf(j, yy, mm);
      if (+p.payDate.slice(0, 4) !== y) continue;
      const pay = periodSum(j, yy, mm).pay;
      total += pay; if (p.payDate <= td) toDate += pay;
    }
  });
  return { total, toDate };
}
function paydaysIn(y, m) {
  const out = {};
  S.settings.jobs.forEach(j => {
    for (let k = -3; k <= 0; k++) {
      const { y: yy, m: mm } = addM(y, m, k);
      const p = periodOf(j, yy, mm);
      const pp = parseD(p.payDate);
      if (pp.y === y && pp.m === m) {
        const sum = periodSum(j, yy, mm);
        if (!sum.pay) continue;
        (out[p.payDate] ||= []).push({ job: j, amount: sum.pay, period: p });
      }
    }
  });
  return out;
}

function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

function viewGraph() {
  const { y, m, graphMode: gm, graphType: gt } = S;
  const tx = gm === 'month' ? month(y, m).tx : Array.from({ length: 12 }, (_, i) => month(y, i + 1).tx).flat();
  const list = tx.filter(t => t.type === gt);
  const total = list.reduce((a, t) => a + t.amount, 0);
  const by = {}; list.forEach(t => by[t.cat] = (by[t.cat] || 0) + t.amount);
  const rows = Object.entries(by).map(([id, v]) => ({ c: catById(gt, id), v })).sort((a, b) => b.v - a.v);
  // ドーナツ（支出は予算の合計で一周）
  const budgetSum = gt === 'expense' ? Object.values(S.settings.budgets || {}).reduce((a, v) => a + (Number(v) || 0), 0) * (gm === 'month' ? 1 : 12) : 0;
  const dScale = Math.max(budgetSum, total) || 1;
  const bp = budgetSum ? Math.round(total / budgetSum * 100) : null;
  const R = 70, C = 2 * Math.PI * R; let acc = 0;
  const arcs = rows.map(r => { const len = r.v / dScale * C; const el = `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${r.c.color}" stroke-width="30" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)"/>`; acc += len; return el; }).join('');
  const donut = `<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="カテゴリーごとの割合"><circle r="${R}" cx="100" cy="100" fill="none" stroke="var(--surface-2)" stroke-width="30"/>${arcs}<text x="100" y="${bp !== null ? 88 : 94}" text-anchor="middle" font-size="12" style="fill:var(--muted)">${gt === 'expense' ? '支出' : '収入'}の合計</text><text x="100" y="${bp !== null ? 110 : 116}" text-anchor="middle" font-size="19" font-weight="700" style="font-variant-numeric:tabular-nums">${yen(total)}</text>${bp !== null ? `<text x="100" y="128" text-anchor="middle" font-size="11" style="fill:${bp > 100 ? 'var(--expense)' : 'var(--muted)'};font-variant-numeric:tabular-nums">予算の${bp}%</text>` : ''}</svg>`;
  const donutNote = gt !== 'expense' ? '' : budgetSum ? `<p class="hint" style="margin:0 0 8px;text-align:center">${total > budgetSum ? `<span style="color:var(--expense)">予算 ${yen(budgetSum)} を ${yen(total - budgetSum)} こえました</span>` : `予算 ${yen(budgetSum)}。輪が一周すると使い切りです（残り ${yen(budgetSum - total)}）`}</p>` : '<p class="hint" style="margin:0 0 8px;text-align:center">予算を決めると、予算の金額で輪が一周するようになります。</p>';
  const budgets = S.settings.budgets || {};
  const showBudget = gm === 'month' && gt === 'expense';
  const legend = rows.map(r => {
    const b = showBudget ? Number(budgets[r.c.id]) || 0 : 0;
    const bp = b ? r.v / b : 0;
    return `<div class="row"><span class="dot" style="background:${r.c.color}"></span><div class="main"><div class="t">${esc(r.c.name)}</div>${b ? `<div class="budgetbar"><i style="width:${Math.min(100, bp * 100)}%;background:${bp > 1 ? 'var(--expense)' : bp > .8 ? 'var(--warn)' : 'var(--ok)'}"></i></div><div class="s">予算 ${yen(b)}・${bp > 1 ? `${yen(r.v - b)}オーバー` : `残り ${yen(b - r.v)}`}</div>` : ''}</div><span class="muted num" style="font-size:12px">${(r.v / total * 100).toFixed(1)}%</span><span class="v">${yen(r.v)}</span></div>`;
  }).join('');
  // 予算全体
  let budgetCard = '';
  if (showBudget) {
    const tb = Object.values(budgets).reduce((a, v) => a + (Number(v) || 0), 0);
    const unused = catsOf('expense').filter(c => budgets[c.id] && !by[c.id]);
    if (tb) {
      const p = total / tb;
      budgetCard = `<section class="card"><h2>${m}月の予算<span class="sub">${yen(total)} / ${yen(tb)}</span></h2><div class="meter"><i class="${p > 1 ? 'over' : p > .8 ? 'warn' : ''}" style="width:${Math.min(100, p * 100)}%"></i></div><div class="meter-note"><span>${p > 1 ? `${yen(total - tb)}オーバー` : `残り ${yen(tb - total)}`}</span><span>${dailyLeft(tb - total)}</span></div>${unused.length ? `<p class="hint" style="margin:8px 0 0">まだ使っていない予算：${unused.map(c => `${esc(c.name)} ${yen(budgets[c.id])}`).join('、')}</p>` : ''}</section>`;
    } else {
      budgetCard = `<section class="card"><h2>予算</h2><p class="hint" style="margin:0 0 10px">カテゴリーごとに月の予算を決めると、使いすぎが一目でわかります。</p><button class="btn" data-budgets style="width:100%">予算を決める</button></section>`;
    }
  }
  // カテゴリー別の横棒（前の月・前の年と比べる）
  const prevTx = gm === 'month' ? (p => month(p.y, p.m).tx)(addM(y, m, -1)) : Array.from({ length: 12 }, (_, i) => month(y - 1, i + 1).tx).flat();
  const prevBy = {}; prevTx.filter(t => t.type === gt).forEach(t => prevBy[t.cat] = (prevBy[t.cat] || 0) + t.amount);
  const prevName = gm === 'month' ? '先月' : '去年';
  const hrows = rows.slice();
  if (showBudget) catsOf('expense').forEach(c => { if (budgets[c.id] && !by[c.id]) hrows.push({ c, v: 0 }); });
  const hmax = Math.max(1, ...hrows.map(r => Math.max(r.v, showBudget ? Number(budgets[r.c.id]) || 0 : 0)));
  const hbars = hrows.map(r => {
    const b = showBudget ? Number(budgets[r.c.id]) || 0 : 0;
    const pv = prevBy[r.c.id] || 0; const diff = r.v - pv;
    const over = b && r.v > b;
    const cmp = !pv ? `${prevName}は0円` : diff === 0 ? `${prevName}と同じ` : `${prevName}より <span class="${(diff > 0) === (gt === 'expense') ? 'up' : 'down'}">${diff > 0 ? '+' : '-'}${yen(Math.abs(diff))}</span>`;
    return `<div><div class="hb-top"><span class="hb-name"><i style="background:${r.c.color}"></i>${esc(r.c.name)}</span><span class="hb-val" ${over ? 'style="color:var(--expense)"' : ''}>${yen(r.v)}</span></div>

  const top = niceMax(Math.max(1, ...ym.map(v => Math.max(v.i, v.e))));

  </section>
  ${barCard}
  ${salaryCard(y, m, gm)}
  ${budgetCard}
  <section class="card">
    <h2>${y}年の収支<span class="sub num">収入 ${yen(yi)}・支出 ${yen(ye)}</span></h2>
    <div class="legend"><span><i style="background:var(--income)"></i>収入</span><span><i style="background:var(--expense)"></i>支出</span><span class="ymax num" style="margin-left:auto">最大 ${yen(top)}</span></div>
    <div class="bars">${ym.map((v, i) => `<div class="col${i + 1 === m ? ' cur' : ''}" title="${i + 1}月 収入${yen(v.i)} 支出${yen(v.e)}"><i style="height:${v.i / top * 100}%;background:var(--income)"></i><i style="height:${v.e / top * 100}%;background:var(--expense)"></i></div>`).join('')}</div>
    <div class="bars-x">${ym.map((_, i) => `<span>${i + 1}</span>`).join('')}</div>
  </section>`;
}
// 給料の見込み（外側）と実績（内側）。どちらも「もらう日」がその期間にあるものを数える
function salaryCard(y, m, gm) {
  const months = gm === 'month' ? [m] : Array.from({ length: 12 }, (_, i) => i + 1);
  const est = {}, act = {};
  months.forEach(mm => Object.values(paydaysIn(y, mm)).flat().forEach(x => { est[x.job.id] = (est[x.job.id] || 0) + x.amount; }));
  months.flatMap(mm => month(y, mm).tx).filter(t => t.type === 'income' && (t.payJob || t.cat === 'i_salary')).forEach(t => {
    const k = t.payJob && jobById(t.payJob) ? t.payJob : '_other';
    act[k] = (act[k] || 0) + t.amount;
  });
  const te = Object.values(est).reduce((a, v) => a + v, 0), ta = Object.values(act).reduce((a, v) => a + v, 0);
  const label = gm === 'month' ? `${m}月` : `${y}年`;
  if (!te && !ta) return `<section class="card"><h2>${label}の給料　見込みと実績</h2><div class="empty">${label}にもらう給料の見込みも、記録した給料もまだありません。<br>シフトを入れると見込みが、給料日に「収入に記録」を押すと実績が出ます。</div></section>`;
  const keys = S.settings.jobs.map(j => j.id).concat(act._other ? ['_other'] : []).filter(k => est[k] || act[k]);
  const info = k => k === '_other' ? { name: 'バイト先なしの給料', color: '#8a8f8e' } : jobById(k);
  const goal = (Number(S.settings.goalMonthly) || 0) * months.length;
  const scale = Math.max(goal, te, ta);
  const ring = (R, sw, vals) => {
    const C = 2 * Math.PI * R; let acc = 0;
    return `<circle r="${R}" cx="110" cy="110" fill="none" stroke="var(--surface-2)" stroke-width="${sw}"/>` + keys.map(k => {
      const v = vals[k] || 0; if (!v) return '';
      const len = v / scale * C; const seg = `<circle r="${R}" cx="110" cy="110" fill="none" stroke="${info(k).color}" stroke-width="${sw}" stroke-dasharray="${Math.max(0, len - 1.5)} ${C - Math.max(0, len - 1.5)}" stroke-dashoffset="${-acc}" transform="rotate(-90 110 110)"/>`;
      acc += len; return seg;
    }).join('');
  };
  const rate = goal ? Math.round(ta / goal * 100) : te ? Math.round(ta / te * 100) : null;
  const svg = `<svg class="donut" viewBox="0 0 220 220" role="img" aria-label="外側が給料の見込み、内側が給料の実績">
    ${ring(92, 22, est)}${ring(64, 22, act)}
    <text x="110" y="${goal ? 89 : 96}" text-anchor="middle" font-size="11" style="fill:var(--muted)">実績</text>
    <text x="110" y="${goal ? 109 : 117}" text-anchor="middle" font-size="17" font-weight="700" style="font-variant-numeric:tabular-nums">${yen(ta)}</text>
    <text x="110" y="${goal ? 126 : 135}" text-anchor="middle" font-size="10.5" style="fill:var(--muted);font-variant-numeric:tabular-nums">見込み ${yen(te)}</text>
    ${goal ? `<text x="110" y="141" text-anchor="middle" font-size="10.5" style="fill:var(--warn);font-variant-numeric:tabular-nums">目標 ${yen(goal)}</text>` : ''}
  </svg>`;
  const rows = keys.map(k => {
    const e = est[k] || 0, a = act[k] || 0, d = a - e;
    const pill = !e ? '<span class="pill">見込みなし</span>' : !a ? '<span class="pill">まだ</span>' : d === 0 ? '<span class="pill ok">見込みどおり</span>' : d > 0 ? `<span class="pill ok">+${num(d)}円</span>` : `<span class="pill warn">${num(d)}円</span>`;
    return `<div class="row"><span class="dot" style="background:${info(k).color};border-radius:4px"></span><div class="main"><div class="t">${esc(info(k).name)}</div><div class="s num">実績 ${yen(a)}・見込み ${yen(e)}</div></div>${pill}</div>`;
  }).join('');
  return `<section class="card">
    <h2>${label}の給料　見込みと実績${rate !== null ? `<span class="sub">${goal ? `目標の${rate}%を受け取りずみ` : `見込みの${rate}%を受け取りずみ`}</span>` : ''}</h2>
    <div class="legend" style="justify-content:center;margin-bottom:2px"><span>外側の輪：見込み</span><span>内側の輪：実績</span></div>
    <div class="donut-wrap">${svg}</div>
    ${goal ? `<div class="meter-note" style="justify-content:center;margin:-4px 0 8px"><span>${ta >= goal ? `内側の輪が一周しました。${gm === 'month' ? '月' : '年'}の目標を達成しています` : te >= goal ? `見込みでは目標に届きます。あと ${yen(goal - ta)} 受け取れば一周` : `見込みでも目標まで ${yen(goal - te)} 足りません`}</span></div>` : ''}
    <div class="list">${rows}</div>
    <p class="hint" style="margin:8px 0 0">${goal ? `輪が一周すると、給料の目標（${gm === 'month' ? '月' : '1年で12か月分'} ${yen(goal)}）に届いたことになります。目標は設定で変えられます。` : '設定で月の目標額を入れると、目標の金額で輪が一周するようになります。'}見込みは、給料日が${label}になる分をシフトから計算しています（交通費をふくむ）。実績は、カテゴリー「給料」で記録した収入です。給料日にカレンダーの「収入に記録」を押すと、バイト先ごとに分かれます。</p>
  </section>`;
}
function dailyLeft(rest) {
  const t = new Date(); if (t.getFullYear() !== S.y || t.getMonth() + 1 !== S.m || rest <= 0) return '';
  const left = dim(S.y, S.m) - t.getDate() + 1;
  return `1日あたり ${yen(rest / left)}`;
}

const dayLabel = d => d ? `毎月${d}日` : '毎月末日';
const ymLabel = ym => { const [y, m] = ym.split('-').map(Number); return `${y}年${m}月`; };
function fixedSection() {

  const totE = active.filter(f => f.type === 'expense').reduce((a, f) => a + inYen(f), 0);

function evalExpr(s) {
  const toks = s.match(/\d+(?:\.\d*)?|[+\-×÷]/g) || [];
  const nums = [], ops = [];
  let cur = null;
  for (const t of toks) {
    if (/\d/.test(t)) cur = Number(t);
    else { if (cur === null) continue; nums.push(cur); ops.push(t); cur = null; }
  }
  if (cur !== null) nums.push(cur); else ops.pop();
  if (!nums.length) return 0;
  const n2 = [nums[0]], o2 = [];
  ops.forEach((o, i) => {
    const b = nums[i + 1];
    if (o === '×') n2[n2.length - 1] *= b;
    else if (o === '÷') n2[n2.length - 1] = b ? n2[n2.length - 1] / b : 0;
    else { o2.push(o); n2.push(b); }
  });
  let r = n2[0]; o2.forEach((o, i) => r = o === '+' ? r + n2[i + 1] : r - n2[i + 1]);
  return Math.max(0, Math.round(r * 100) / 100);
}

const payKey = x => `${x.period.y}-${x.period.m}`;
const payRecorded = (jobId, key) => Object.values(S.months).some(m => (m.tx || []).some(t => t.payJob === jobId && t.payPeriod === key));
const askLater = new Set();
// 今日までに来た給料日のうち、まだ金額を記録していないもの（直近3か月）
function duePaydays() {
  const td = todayStr(), t = parseD(td), out = [];
  const skip = S.settings.paySkip || [];
  for (let k = -2; k <= 0; k++) {
    const p = addM(t.y, t.m, k);
    Object.entries(paydaysIn(p.y, p.m)).forEach(([date, arr]) => {
      if (date > td) return;
      arr.forEach(x => {
        const id = x.job.id + '|' + payKey(x);
        if (payRecorded(x.job.id, payKey(x)) || skip.includes(id) || askLater.has(id)) return;
        out.push({ ...x, date, id });
      });
    });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

// ---------- パスコード ----------
async function sha(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('shift-kakeibo:' + s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function pinPad(title, onDone) {
  const el = $('#lock'); let v = '';
  el.innerHTML = `<h3>${title}</h3><div class="pins" id="pins">${'<i></i>'.repeat(4)}</div><div class="pinpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-p="${n}">${n}</button>`).join('')}<button class="blank" aria-hidden="true"></button><button data-p="0">0</button><button data-p="del" aria-label="1文字消す" style="font-size:16px">消す</button></div><div id="pinExtra"></div>`;
  el.hidden = false;
  const paint = () => $$('#pins i').forEach((i, k) => i.classList.toggle('f', k < v.length));
  el.onclick = async e => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    if (b.dataset.p === 'del') v = v.slice(0, -1); else if (v.length < 4) v += b.dataset.p;
    paint();
    if (v.length === 4) { const ok = await onDone(v); if (ok === false) { const p = $('#pins'); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); v = ''; setTimeout(paint, 250); } }
  };
  return el;
}
function showLock() {
  pinPad('パスコードを入力', async v => {
    if (await sha(v) === S.settings.pass) { S.unlocked = true; try { sessionStorage.setItem('kk-unlocked', '1'); } catch (e) {} $('#lock').hidden = true; setTimeout(maybeAskPay, 300); return true; }

function setPass() {

// ---------- 書き出し・読み込み ----------
async function exportData(kind) {
  let filename, data;
  if (kind === 'csv') {
    const rows = [['日付', '種類', 'カテゴリー', '金額', 'メモ', 'ドル', 'レート']];
    Object.values(S.months).flatMap(m => m.tx).sort((a, b) => a.date.localeCompare(b.date)).forEach(t => rows.push([t.date, t.type === 'income' ? '収入' : '支出', catById(t.type, t.cat).name, t.amount, t.memo || '', t.currency === 'USD' ? t.usd : '', t.currency === 'USD' ? t.rate : '']));
    rows.push([]); rows.push(['日付', 'シフト', 'バイト先', '開始', '終了', '休憩(分)', '勤務(分)', '給料見込み']);
    allShifts().sort((a, b) => a.date.localeCompare(b.date)).forEach(s => { const j = jobById(s.jobId); const r = calcShift(s, j); rows.push([s.date, 'シフト', j ? j.name : '', s.start, s.end, s.brk || 0, r.work, r.pay]); });
    data = '﻿' + rows.map(r => r.map(c => { const x = String(c ?? ''); return /[",\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x; }).join(',')).join('\r\n');
    filename = `kakeibo-${todayStr()}.csv`;
  } else {
    const s = clone(S.settings); delete s.pass;
    data = JSON.stringify({ app: 'shift-kakeibo', v: 1, exported: new Date().toISOString(), settings: s, months: S.months }, null, 1);
    filename = `kakeibo-backup-${todayStr()}.json`;
  }
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
  const done = msg => { if (kind === 'json') { S.settings.lastBackup = todayStr(); persist('settings'); render(); } toast(msg); };
  if (dl) {
    try { await dl.save({ filename, data }); done('書き出しました'); }
    catch (e) { if (e && e.code !== 'declined') toast('書き出せませんでした'); }
    return;
  }
  // ホーム画面のアプリ：iPhone の共有シートから「ファイルに保存」などへ渡す
  const file = new File([data], filename, { type: kind === 'csv' ? 'text/csv' : 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); done('書き出しました'); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    done('書き出しました');
  } catch (e) { toast('書き出せませんでした'); }
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());

// 月の切り替え：古い月が指の向きへ流れ、新しい月が反対側からすべり込む
const viewEl = $('#view'), mainEl = $('main');
const EASE = 'cubic-bezier(.22,.8,.3,1)';
const noMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
let sliding = false;
function slideMonth(k) {
  if (sliding) return;
  const go = () => { const p = addM(S.y, S.m, k); S.y = p.y; S.m = p.m; render(); };
  if (noMotion()) { go(); resetView(); return; }
  sliding = true;
  const w = viewEl.offsetWidth || 360, dir = Math.sign(k);
  viewEl.style.transition = `transform .2s ${EASE}, opacity .2s ease-out`;
  viewEl.style.transform = `translateX(${-dir * w * 0.6}px)`;
  viewEl.style.opacity = '0';
  setTimeout(() => {
    go();
    viewEl.style.transition = 'none';
    viewEl.style.transform = `translateX(${dir * w * 0.4}px)`;
    void viewEl.offsetWidth;
    viewEl.style.transition = `transform .32s ${EASE}, opacity .26s ease-out`;
    viewEl.style.transform = 'translateX(0)';
    viewEl.style.opacity = '1';
    setTimeout(() => { resetView(); sliding = false; }, 340);
  }, 200);
}
function resetView() { viewEl.style.transition = ''; viewEl.style.transform = ''; viewEl.style.opacity = ''; }

// 指の動きに合わせて画面がついてくる
let sx = null, sy = null, dxNow = 0, axis = null;
mainEl.addEventListener('touchstart', e => {
  // 入力欄の上から始めた指の動きは、文字の選択に使うのでスワイプにしない
  if (e.touches.length !== 1 || sliding || e.target.closest('input, select, textarea')) { sx = null; return; }
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; dxNow = 0; axis = null;
}, { passive: true });
mainEl.addEventListener('touchmove', e => {
  if (sx === null) return;
  const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
  if (!axis && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) axis = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'x' : 'y';
  if (axis !== 'x') return;
  dxNow = dx;
  const w = viewEl.offsetWidth || 360;
  viewEl.style.transition = 'none';
  viewEl.style.transform = `translateX(${dx * 0.85}px)`;
  viewEl.style.opacity = String(1 - Math.min(0.55, Math.abs(dx) / w * 0.7));
}, { passive: true });
const endSwipe = cancelled => {
  if (sx === null) return;
  sx = null;
  if (axis !== 'x') return;
  if (!cancelled && Math.abs(dxNow) > 60) { slideMonth(dxNow < 0 ? 1 : -1); return; }
  viewEl.style.transition = `transform .25s ${EASE}, opacity .25s`;
  viewEl.style.transform = 'translateX(0)'; viewEl.style.opacity = '1';
  setTimeout(resetView, 260);
};
mainEl.addEventListener('touchend', () => endSwipe(false), { passive: true });
mainEl.addEventListener('touchcancel', () => endSwipe(true), { passive: true });

$('#view').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.date) {
    S.sel = d.date; render();
    // カレンダーの日付は入力メニューを開く。明細の日付見出しはその日の詳しい表示へ
    if (b.classList.contains('day')) openAddMenu(true); else scrollToDay();
    return;
  }
  if (d.add) return addBy(d.add, S.sel);
  if (d.tx) return openTx({ id: d.tx });
  if (d.shift) return openShift({ id: d.shift });
  if (d.paytx) {
    const [jid, py, pm] = d.paytx.split('|');
    const x = (paydaysIn(S.y, S.m)[S.sel] || []).find(v => v.job.id === jid && `${v.period.y}-${v.period.m}` === `${py}-${pm}`);
    if (x) { askLater.delete(jid + '|' + py + '-' + pm); return openPayAsk({ ...x, date: S.sel, id: jid + '|' + py + '-' + pm }); }
    return;
  }
  if (d.gm) { S.graphMode = d.gm; return render(); }
  if (d.gt) { S.graphType = d.gt; return render(); }
  if (d.newjob !== undefined) return openJob();
  if (d.job) return openJob(d.job);
  if (d.newfixed !== undefined) return openFixed();
  if (d.fixed) return openFixed(d.fixed);
  if (d.cats !== undefined) return openCats();
  if (d.budgets !== undefined) return openBudgets();
  if (d.accent) { S.settings.accent = d.accent; applyAccent(); persist('settings'); return render(); }
  if (d.export) return exportData(d.export);
  if (d.import !== undefined) return $('#importFile').click();
  if (b.id === 'passSw') {
    if (S.settings.pass) { confirmBtn(b, '', () => { S.settings.pass = null; persist('settings'); render(); toast('ロックを外しました'); }); if (b.dataset.armed) toast('もう一度押すとロックを外します'); }
    else setPass();
  }
});
// 設定の数字の欄：打ったそばから保存する（欄から抜ける前に月を変えても消えないように）
const LIVE_FIELDS = ['goalIn', 'wallCustomIn', 'rateIn'];
function saveField(t, final) {
  if (t.id === 'goalIn') { const v = yenVal(t.value); if (v === (Number(S.settings.goalMonthly) || 0) && !final) return; S.settings.goalMonthly = v; }
  else if (t.id === 'wallCustomIn') { const v = yenVal(t.value); if (v === Number(S.settings.wall) && !final) return; S.settings.wall = v; }
  else if (t.id === 'rateIn') { const r = Math.max(0, parseFloat(t.value) || 0); if (r === (Number(S.settings.usdRate) || 0) && !final) return; S.settings.usdRate = r || null; S.settings.usdRateDate = r ? todayStr() : null; }
  else return;
  persist('settings');
}
let liveT = null;
$('#view').addEventListener('input', e => {
  const t = e.target; if (!LIVE_FIELDS.includes(t.id)) return;
  clearTimeout(liveT); liveT = setTimeout(() => saveField(t, false), 400);
});
$('#view').addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'rateIn') { clearTimeout(liveT); saveField(t, true); toast('レートを保存しました'); render(); }
  if (t.id === 'goalIn') { clearTimeout(liveT); saveField(t, true); t.value = S.settings.goalMonthly ? num(S.settings.goalMonthly) : ''; toast('目標を保存しました'); }
  if (t.id === 'wallIn') {
    if (t.value === 'custom') { $('#wallCustomWrap').hidden = false; $('#wallCustomIn').focus(); return; }
    S.settings.wall = +t.value; persist('settings'); render();
  }
  if (t.id === 'wallCustomIn') { clearTimeout(liveT); saveField(t, true); t.value = S.settings.wall ? num(S.settings.wall) : ''; toast('上限を保存しました'); }
});

// 開いたまま月をまたいだときも固定費を記録する
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.ready) { applyFixed(); render(); maybeAskPay(); } });

render();
boot();
})();
</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
